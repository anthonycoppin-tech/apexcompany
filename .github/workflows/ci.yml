name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Le job qui compte. Il rejoue les migrations sur une base vierge, charge le
  # seed, et exécute les tests de politiques RLS. Une fuite de cloisonnement
  # entre coachs ou un accès financier ouvert casse la CI ici, avant la revue.
  # ───────────────────────────────────────────────────────────────────────────
  database:
    name: Migrations et politiques RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Démarrer Supabase
        run: npx supabase start

      - name: Appliquer les migrations sur une base vierge et charger le seed
        # db reset rejoue toutes les migrations puis charge supabase/seed.sql.
        run: npx supabase db reset

      - name: Écart éventuel entre le schéma appliqué et les migrations
        # Informatif : `db diff` sort en 0 même quand il trouve une différence.
        # Une sortie non vide ici signale une migration écrite après coup contre
        # une base modifiée à la main ; le prochain déploiement propre échouera.
        run: npx supabase db diff --schema public

      - name: Tests pgTAP
        run: npx supabase test db

      # Un compte du seed a fini avec une colonne NULL que GoTrue exige vide
      # (« Database error querying schema » à la connexion) sans qu'aucun test
      # RLS ne le remarque : pgTAP interroge la base via `set role`, jamais un
      # vrai /auth/v1/token. Seul un login réel attrape cette classe de bug.
      - name: Connexion réelle avec un compte du seed
        run: |
          eval "$(npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY)"

          REPONSE=$(curl -s -w "\n%{http_code}" -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"coach.a@apex.test","password":"password123"}')

          CODE=$(echo "$REPONSE" | tail -1)
          CORPS=$(echo "$REPONSE" | sed '$d')

          if [ "$CODE" != "200" ]; then
            echo "Échec de connexion (HTTP $CODE) : $CORPS"
            exit 1
          fi
          echo "Connexion OK"

      - name: Journaux Supabase en cas déchec
        if: failure()
        run: npx supabase status && docker ps -a

  quality:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Même vérification que celle utilisée en local, où Docker est indisponible.
      # Rapide, et elle échoue avant le job Docker si une politique a cédé.
      - name: Invariants RLS (PGlite)
        run: npm run db:check

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne doit pas dépendre dun secret réel.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
