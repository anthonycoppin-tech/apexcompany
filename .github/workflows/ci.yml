name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Le job qui compte. Il rejoue les migrations sur une base vierge, charge le
  # seed, et exécute les tests de politiques RLS. Une fuite de cloisonnement
  # entre coachs ou un accès financier ouvert casse la CI ici, avant la revue.
  # ───────────────────────────────────────────────────────────────────────────
  database:
    name: Migrations et politiques RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Démarrer Supabase
        run: npx supabase start

      - name: Appliquer les migrations sur une base vierge et charger le seed
        run: npx supabase db reset --no-seed=false

      - name: Vérifier que le schéma appliqué correspond aux migrations
        # Une différence ici signale une migration écrite après coup contre une
        # base déjà modifiée à la main : le prochain déploiement propre échouera.
        run: npx supabase db diff --schema public

      - name: Tests pgTAP
        run: npx supabase test db

      - name: Journaux Supabase en cas déchec
        if: failure()
        run: npx supabase status && docker ps -a

  quality:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Même vérification que celle utilisée en local, où Docker est indisponible.
      # Rapide, et elle échoue avant le job Docker si une politique a cédé.
      - name: Invariants RLS (PGlite)
        run: npm run db:check

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne doit pas dépendre dun secret réel.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
